name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# NOTE: the `secrets` context is NOT available in job-level `if:` conditions
# (that fails the whole workflow with zero jobs). Credential availability is
# therefore probed inside the job at step level, so the job always runs and
# reports a real status: each deployment phase simply logs an informative
# notice when its credentials are not configured, instead of the job being
# listed as "skipped".
#
# Hosting targets (matching the actual infrastructure):
#   Frontend  → Vercel  (VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID)
#   Backend   → MonsterASP.NET via FTPS
#               (MONSTERASP_FTP_HOST / MONSTERASP_FTP_USER / MONSTERASP_FTP_PASS;
#               optional MONSTERASP_FTP_PORT, MONSTERASP_REMOTE_DIR, MONSTERASP_SITE_URL)
#   Database  → MonsterASP SQL (databaseasp.net) — set via DATABASE_CONNECTION_STRING;
#               the app runs EF migrations + seeding itself on startup.

jobs:
  deploy:
    name: Deploy (Frontend → Vercel, Backend → MonsterASP.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check deployment credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "vercel=true" >> "$GITHUB_OUTPUT"
            echo "✓ Vercel credentials present."
          else
            echo "vercel=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Frontend deploy disabled: add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID to repository secrets to enable it."
          fi
          if [ -n "${{ secrets.MONSTERASP_FTP_HOST }}" ] && [ -n "${{ secrets.MONSTERASP_FTP_USER }}" ] && [ -n "${{ secrets.MONSTERASP_FTP_PASS }}" ]; then
            echo "monsterasp=true" >> "$GITHUB_OUTPUT"
            echo "✓ MonsterASP.NET FTP credentials present."
          else
            echo "monsterasp=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Backend deploy disabled: add MONSTERASP_FTP_HOST, MONSTERASP_FTP_USER and MONSTERASP_FTP_PASS (Deploy page → FTP / SFTP access) to repository secrets to enable it."
          fi

      # ── Frontend (Vercel, prebuilt artifacts) ──────────────────────────────
      - name: Setup Node.js
        if: steps.creds.outputs.vercel == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install Vercel CLI
        if: steps.creds.outputs.vercel == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.creds.outputs.vercel == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        working-directory: Frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        if: steps.creds.outputs.vercel == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
        working-directory: Frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_URL: ${{ secrets.PROD_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy Project Artifacts to Vercel
        if: steps.creds.outputs.vercel == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        working-directory: Frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # ── Backend (MonsterASP.NET via FTPS) ──────────────────────────────────
      - name: Setup .NET
        if: steps.creds.outputs.monsterasp == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: 'Backend/StarbucksEgypt.slnx'

      - name: Cache NuGet packages
        if: steps.creds.outputs.monsterasp == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        if: steps.creds.outputs.monsterasp == 'true'
        run: dotnet restore StarbucksEgypt.slnx
        working-directory: Backend

      - name: Publish backend
        if: steps.creds.outputs.monsterasp == 'true'
        run: dotnet publish StarbucksEgypt.slnx -c Release -o ./publish --no-restore
        working-directory: Backend

      - name: Generate appsettings.Production.json from secrets
        if: steps.creds.outputs.monsterasp == 'true'
        run: |
          jq -n \
            --arg db "$DATABASE_CONNECTION_STRING" \
            --arg jwt "$JWT_SECRET" \
            --arg cors "$CORS_ORIGINS" \
            '{
              "ConnectionStrings": { "DefaultConnection": $db },
              "Jwt": { "Secret": $jwt },
              "Cors": { "AllowedOrigins": $cors },
              "Logging": { "EnableSensitiveDataLogging": false }
            }' > ./publish/appsettings.Production.json
          echo "✓ appsettings.Production.json generated from repository secrets (never committed)."
        working-directory: Backend
        env:
          # Rotate the DB password first — the old one was leaked in git history (issue #31).
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}

      - name: Install lftp
        if: steps.creds.outputs.monsterasp == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload backend to MonsterASP.NET (FTPS)
        if: steps.creds.outputs.monsterasp == 'true'
        run: |
          # Mirror the publish folder to the site root (wwwroot) over FTPS.
          # --delete keeps the server in sync; SSL is enforced.
          lftp ftps://"$MONSTERASP_FTP_HOST":"$MONSTERASP_FTP_PORT" \
            -u "$MONSTERASP_FTP_USER","$MONSTERASP_FTP_PASS" \
            -e "set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no; mirror -R -v --delete --delete-first ./publish $MONSTERASP_REMOTE_DIR; bye"
        working-directory: Backend
        env:
          MONSTERASP_FTP_HOST: ${{ secrets.MONSTERASP_FTP_HOST }}
          MONSTERASP_FTP_PORT: ${{ secrets.MONSTERASP_FTP_PORT }}
          MONSTERASP_FTP_USER: ${{ secrets.MONSTERASP_FTP_USER }}
          MONSTERASP_FTP_PASS: ${{ secrets.MONSTERASP_FTP_PASS }}
          # MonsterASP serves the site from wwwroot (WebFTP root)
          MONSTERASP_REMOTE_DIR: ${{ vars.MONSTERASP_REMOTE_DIR || 'wwwroot' }}

      - name: Verify backend deployment
        if: steps.creds.outputs.monsterasp == 'true' && secrets.MONSTERASP_SITE_URL != ''
        run: |
          sleep 10
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$MONSTERASP_SITE_URL/swagger/v1/swagger.json" || true)
          echo "Swagger endpoint HTTP status: $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "⚠️  Backend did not respond with 200 — check the MonsterASP.NET control panel logs."
            exit 1
          fi
          echo "✓ Backend is live."
        env:
          MONSTERASP_SITE_URL: ${{ secrets.MONSTERASP_SITE_URL }}

      # ── GitHub Release (always runs on production push) ───────────────────
      - name: Get Version
        id: version
        run: |
          VERSION=$(node -p "require('./Frontend/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Tag
        run: |
          git tag "v${{ steps.version.outputs.VERSION }}" || true
          git push origin "v${{ steps.version.outputs.VERSION }}" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
