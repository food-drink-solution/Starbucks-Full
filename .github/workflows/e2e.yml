name: E2E Tests

# Post-merge deep verification: the full Playwright browser suite runs
# against a complete stack — SQL Server + Redis + the ASP.NET API (Development
# seeding) + the vite dev server (proxying /api to the API) — mirroring the
# local setup. Not a pull-request gate: PRs are covered by the fast CI
# workflow (lint / type check / unit tests).

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Frontend/**'
      - 'Backend/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E Tests (full stack)
    runs-on: ubuntu-latest
    env:
      # Test-only credentials for the SQL Server + API containers
      SA_PASSWORD: Test123!SA
      JWT_SECRET: e2e-ci-jwt-secret-0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: Frontend

      - name: Resolve Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: Frontend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: Frontend

      # ── Full-stack dependencies ───────────────────────────────────────────
      - name: Start SQL Server 2022
        run: |
          docker run -d --name e2e-sql \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=$SA_PASSWORD \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest

      - name: Start Redis
        run: |
          docker run -d --name e2e-redis -p 6379:6379 redis:7-alpine

      - name: Wait for SQL Server to accept connections
        run: |
          # Two gotchas this step guards against:
          #  1. A cold container spends 60-120s+ copying system database files
          #     and running upgrade steps before accepting connections.
          #  2. Recent mssql/server:2022-latest images no longer bundle sqlcmd,
          #     so a docker-exec probe silently fails on every attempt.
          # Readiness = the server's own startup log line + a TCP probe on 1433.
          for i in $(seq 1 150); do
            if docker logs e2e-sql 2>&1 | grep -q "SQL Server is now ready for client connections" \
              && timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/1433' 2>/dev/null; then
              echo "SQL Server is ready (after ~$((i * 2))s)"
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready in time"
          docker logs e2e-sql --tail 200 || true
          exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: 'Backend/StarbucksEgypt.slnx'

      - name: Start backend API (Development seeding enabled)
        run: |
          cd Backend
          dotnet run --project src/Starbucks.API \
            -c Release \
            --urls http://0.0.0.0:8080 &
          echo $! > /tmp/backend.pid
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: >-
            Server=localhost;Database=StarbucksE2EDb;User Id=sa;Password=Test123!SA;TrustServerCertificate=true;MultipleActiveResultSets=true
          Jwt__Secret: ${{ env.JWT_SECRET }}

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/swagger/v1/swagger.json || true)
            if [ "$code" = "200" ]; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          exit 1

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        working-directory: Frontend
        env:
          CI: true

      - name: Backend log dump on failure
        if: failure()
        run: |
          tail -n 300 "Backend/Logs"/*.log 2>/dev/null || true
          docker logs e2e-sql --tail 100 2>/dev/null || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: Frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: Frontend/test-results/
          retention-days: 7
