name: E2E Tests

# Post-merge deep verification: full Playwright browser suite.
# Not a pull-request gate — PRs are covered by the fast CI workflow
# (lint / type check / unit tests). This keeps the PR gate quick and
# leaves no "skipped" jobs in the UI.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Frontend/**'
      - 'Backend/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: Frontend

      - name: Resolve Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: Frontend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: Frontend

      - name: Build frontend for E2E
        run: npm run build
        working-directory: Frontend
        env:
          VITE_API_URL: http://localhost:5000

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        working-directory: Frontend
        env:
          CI: true
          BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: Frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: Frontend/test-results/
          retention-days: 7
