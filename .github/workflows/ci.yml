name: CI

# Fast pull-request gate: lint, type check, unit tests, build.
# Deep verification (integration tests, E2E, Docker) runs post-merge in
# backend-integration.yml, e2e.yml and docker.yml — this keeps every PR
# check fast (~5 min) and leaves no "skipped" jobs in the UI.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend: Lint, Type Check, Unit + Integration Tests + Coverage
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-quality:
    name: Frontend Quality (Lint, Type Check, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: Frontend

      - name: Run linter
        run: npm run lint
        working-directory: Frontend

      - name: Type check
        run: npm run type-check
        working-directory: Frontend

      - name: Run unit/integration tests with coverage
        run: npm run test:coverage -- --reporter=verbose
        working-directory: Frontend

      - name: Check optional Codecov token
        id: codecov-auth
        if: always()
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        # Skip optional uploads when this repository has no Codecov token.
        if: always() && steps.codecov-auth.outputs.enabled == 'true'
        with:
          file: ./Frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: Frontend/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend: Build + Unit Tests (fast, no Docker needed)
  # ─────────────────────────────────────────────────────────────────────────────
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore StarbucksEgypt.slnx
        working-directory: Backend

      - name: Build
        run: dotnet build StarbucksEgypt.slnx --configuration Release --no-restore
        working-directory: Backend

      - name: Run unit tests with coverage
        run: |
          dotnet test src/Starbucks.UnitTests/Starbucks.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage
        working-directory: Backend

      - name: Check optional Codecov token
        id: codecov-auth
        if: always()
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload backend unit test coverage to Codecov
        uses: codecov/codecov-action@v4
        # Skip optional uploads when this repository has no Codecov token.
        if: always() && steps.codecov-auth.outputs.enabled == 'true'
        with:
          directory: Backend/coverage
          flags: backend-unit
          name: backend-unit-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
